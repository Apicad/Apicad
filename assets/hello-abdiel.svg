<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Hey, I'm Abdiel. Stay curious. Build something. Share what you learn.">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211c40"/><stop offset="1" stop-color="#102c40"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".09"/></pattern></defs>
<style>@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.float{animation:float 5s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.float{animation:none}}</style>
<rect width="1200" height="340" rx="22" fill="url(#bg)"/><rect width="1200" height="340" rx="22" fill="url(#grid)"/>
<circle cx="1120" cy="15" r="130" fill="#9a7efa" opacity=".13"/><circle cx="60" cy="340" r="110" fill="#65dfcb" opacity=".09"/>
<text x="55" y="65" fill="#a9e7df" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">WELCOME TO MY CORNER OF GITHUB</text>
<text x="50" y="144" fill="#fff4d7" font-family="Arial,sans-serif" font-size="64" font-weight="700">Hey, I'm Abdiel.</text>
<text x="55" y="190" fill="#c7b8ff" font-family="Arial,sans-serif" font-size="25">Engineer. Educator. Curious builder.</text>
<text x="55" y="248" fill="#e3e8f3" font-family="Arial,sans-serif" font-size="21">Stay curious. Build something.</text>
<text x="55" y="281" fill="#e3e8f3" font-family="Arial,sans-serif" font-size="21">Share what you learn.</text>
<g class="float"><rect x="805" y="73" width="300" height="194" rx="14" fill="#141b2d" stroke="#a898e5" stroke-width="3"/><path d="M805 112h300" stroke="#4a416b" stroke-width="2"/>
<circle cx="827" cy="93" r="5" fill="#ff8c9e"/><circle cx="846" cy="93" r="5" fill="#f6d27b"/><circle cx="865" cy="93" r="5" fill="#70dbc3"/>
<text x="832" y="153" fill="#c9b5ff" font-family="monospace" font-size="20">idea = curiosity</text>
<text x="832" y="189" fill="#71e0c4" font-family="monospace" font-size="20">build(idea)</text>
<text x="832" y="225" fill="#f6d27b" font-family="monospace" font-size="20">learn → repeat</text></g>
<g fill="none" stroke="#f6d27b" stroke-width="3"><path d="M750 65v24m-12-12h24"/><path d="M1130 270v24m-12-12h24"/><path d="M730 235l12 12-12 12"/></g>
</svg>
