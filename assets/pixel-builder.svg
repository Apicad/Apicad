<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Hey, I'm Abdiel. Stay curious. Build something. Share what you learn.">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211c40"/><stop offset="1" stop-color="#102c40"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".09"/></pattern></defs>
<style>
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes step{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-10px)}}
@keyframes blink{0%,90%,100%{opacity:1}94%,96%{opacity:0}}
@keyframes spark{0%,100%{opacity:.25}50%{opacity:1}}
.robot{animation:bob .8s steps(2,end) infinite}.left{animation:step .8s steps(1,end) infinite}.right{animation:step .8s steps(1,end) infinite reverse}.eyes{animation:blink 4s steps(1,end) infinite}.spark{animation:spark 2s steps(2,end) infinite}
@media(prefers-reduced-motion:reduce){.robot,.left,.right,.eyes,.spark{animation:none}}
</style>
<rect width="1200" height="340" rx="22" fill="url(#bg)"/><rect width="1200" height="340" rx="22" fill="url(#grid)"/>
<circle cx="1120" cy="15" r="130" fill="#9a7efa" opacity=".13"/><circle cx="60" cy="340" r="110" fill="#65dfcb" opacity=".09"/>
<text x="55" y="65" fill="#a9e7df" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">WELCOME TO MY CORNER OF GITHUB</text>
<text x="50" y="144" fill="#fff4d7" font-family="Arial,sans-serif" font-size="64" font-weight="700">Hey, I'm Abdiel.</text>
<text x="55" y="190" fill="#c7b8ff" font-family="Arial,sans-serif" font-size="25">Engineer. Educator. Curious builder.</text>
<text x="55" y="248" fill="#e3e8f3" font-family="Arial,sans-serif" font-size="21">Stay curious. Build something.</text>
<text x="55" y="281" fill="#e3e8f3" font-family="Arial,sans-serif" font-size="21">Share what you learn.</text>
<!-- Original pixel robot, drawn as crisp SVG blocks. -->
<g shape-rendering="crispEdges">
<rect x="865" y="278" width="176" height="8" fill="#071724" opacity=".5"/>
<g class="robot">
<rect x="948" y="75" width="10" height="24" fill="#c7b8ff"/><rect x="940" y="63" width="26" height="16" fill="#f6d27b"/>
<path d="M903 99h100v10h12v78h-12v12H903v-12h-12v-78h12z" fill="#a696e5"/>
<rect x="903" y="111" width="100" height="66" fill="#70dbc3"/>
<rect x="915" y="123" width="76" height="42" fill="#112b3a"/>
<g class="eyes" fill="#fff4d7"><rect x="927" y="135" width="12" height="12"/><rect x="967" y="135" width="12" height="12"/></g>
<rect x="943" y="157" width="20" height="6" fill="#70dbc3"/>
<rect x="915" y="195" width="76" height="54" fill="#a696e5"/><rect x="927" y="207" width="52" height="24" fill="#30284c"/>
<rect x="937" y="213" width="10" height="10" fill="#f6d27b"/><rect x="955" y="213" width="14" height="10" fill="#70dbc3"/>
<g class="left"><rect x="879" y="199" width="20" height="40" fill="#70dbc3"/><rect x="919" y="245" width="24" height="26" fill="#70dbc3"/><rect x="907" y="263" width="36" height="12" fill="#fff4d7"/></g>
<g class="right"><rect x="1007" y="195" width="20" height="40" fill="#70dbc3"/><rect x="963" y="245" width="24" height="26" fill="#70dbc3"/><rect x="963" y="263" width="36" height="12" fill="#fff4d7"/></g>
</g>
<g class="spark" fill="#f6d27b"><path d="M1060 126h8v8h8v8h-8v8h-8v-8h-8v-8h8z"/><rect x="841" y="191" width="8" height="8"/></g>
</g>
<g fill="none" stroke="#f6d27b" stroke-width="3"><path d="M750 65v24m-12-12h24"/><path d="M1130 270v24m-12-12h24"/><path d="M730 235l12 12-12 12"/></g>
</svg>
